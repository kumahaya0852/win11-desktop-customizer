<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' localfile:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src localfile: blob:;" />
  <title>動画壁紙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      background: #000;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      -webkit-app-region: no-drag;
    }
    .close {
      position: fixed; top: 14px; right: 14px;
      width: 34px; height: 34px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease, background 0.15s ease;
      -webkit-app-region: no-drag;
      z-index: 10;
    }
    body:hover .close { opacity: 1; }
    .close:hover {
      background: rgba(220, 38, 38, 0.55);
      border-color: rgba(248,113,113,0.5);
      color: #fff;
    }
  </style>
</head>
<body>
  <video id="v" autoplay loop playsinline></video>
  <button class="close" id="closeBtn">✕</button>
  <script>
    const params = new URLSearchParams(window.location.search)
    const filePath = params.get('path')
    if (filePath) {
      // localfile:// カスタムスキームで提供（http:オリジンからでもロード可能）
      const url = /^[a-zA-Z]:[\\/]/.test(filePath)
        ? encodeURI('localfile:///' + filePath.replace(/\\/g, '/'))
        : filePath
      document.getElementById('v').src = url
    }
    document.getElementById('closeBtn').addEventListener('click', () => window.close())
  </script>
</body>
</html>
