<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Image Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    /* ウィンドウ全体をドラッグ可能 */
    body { -webkit-app-region: drag; }

    .frame {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
      border-radius: 8px;
      /* ドロップシャドウで画像を際立たせる */
      filter: drop-shadow(0 8px 32px rgba(0,0,0,0.6));
    }

    /* コントロール（ホバーで表示） */
    .controls {
      position: fixed;
      top: 10px; right: 10px;
      display: flex; gap: 6px;
      opacity: 0;
      transition: opacity 200ms ease;
      -webkit-app-region: no-drag;
      z-index: 10;
    }
    body:hover .controls { opacity: 1; }

    .btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(10,10,20,0.82);
      backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 150ms ease;
      -webkit-app-region: no-drag;
    }
    .btn:hover { background: rgba(30,30,60,0.95); color: #fff; border-color: rgba(255,255,255,0.3); }
    .btn-pin.pinned { color: #5b8cff; border-color: rgba(91,140,255,0.5); }
    .btn-close:hover { background: #dc2626; border-color: #dc2626; }

    /* リサイズハンドル（右下） */
    .resize-handle {
      position: fixed;
      right: 0; bottom: 0;
      width: 16px; height: 16px;
      cursor: se-resize;
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img id="img" alt="" />
  </div>

  <div class="controls">
    <button class="btn btn-pin" id="pinBtn" title="最前面固定">📌</button>
    <button class="btn btn-close" id="closeBtn" title="閉じる">✕</button>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>

  <script>
    // URL パラメータから画像パスを取得
    const params = new URLSearchParams(location.search)
    const imgPath = params.get('path')
    if (imgPath) {
      // Windows パスのバックスラッシュを / に変換
      const url = 'file:///' + imgPath.replace(/\\/g, '/')
      document.getElementById('img').src = url
    }

    // 閉じるボタン
    document.getElementById('closeBtn').addEventListener('click', () => {
      window.api?.image?.close?.()
    })

    // 最前面固定ボタン
    let pinned = false
    const pinBtn = document.getElementById('pinBtn')
    pinBtn.addEventListener('click', () => {
      pinned = !pinned
      pinBtn.classList.toggle('pinned', pinned)
      pinBtn.title = pinned ? '最前面固定 ON' : '最前面固定 OFF'
      window.api?.image?.setAlwaysOnTop?.(pinned)
    })

    // 画像ロードエラー時のフォールバック
    document.getElementById('img').addEventListener('error', () => {
      document.getElementById('img').style.display = 'none'
      document.querySelector('.frame').innerHTML +=
        '<div style="color:rgba(255,255,255,0.4);font-family:sans-serif;font-size:13px;">画像を読み込めませんでした</div>'
    })
  </script>
</body>
</html>
